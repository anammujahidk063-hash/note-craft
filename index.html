<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NoteCraft - Select Role</title>

    <link rel="stylesheet" href="role.css">
</head>

<body>

    <div class="background">
        <span class="shape shape-one"></span>
        <span class="shape shape-two"></span>

        <span class="star star-one"></span>
        <span class="star star-two"></span>
        <span class="star star-three"></span>
    </div>

    <main class="role-page">

        <!-- Brand -->
        <header class="brand-section">

            <!-- Code-generated logo -->
            <svg
                class="brand-logo"
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
                aria-label="NoteCraft logo"
            >
                <defs>
                    <linearGradient
                        id="brandGradient"
                        x1="10%"
                        y1="10%"
                        x2="90%"
                        y2="90%"
                    >
                        <stop
                            offset="0%"
                            stop-color="#4338ca"
                        />

                        <stop
                            offset="55%"
                            stop-color="#22d3ee"
                        />

                        <stop
                            offset="100%"
                            stop-color="#a78bfa"
                        />
                    </linearGradient>
                </defs>

                <!-- Letter C -->
                <path
                    d="
                        M80 23
                        C72 15 62 11 50 11
                        C28 11 12 28 12 50
                        C12 72 28 89 50 89
                        C63 89 73 84 80 77
                    "
                    fill="none"
                    stroke="url(#brandGradient)"
                    stroke-width="12"
                    stroke-linecap="round"
                />

                <!-- Letter N -->
                <path
                    d="
                        M32 72
                        V28
                        L68 72
                        V28
                    "
                    fill="none"
                    stroke="url(#brandGradient)"
                    stroke-width="12"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <path
                    d="M61 65 L68 72 L68 60 Z"
                    fill="#c4b5fd"
                />
            </svg>

            <h1>
                Note<span>Craft</span>
            </h1>

            <p class="tagline">
                SMART DIGITAL NOTES MAKER
            </p>

        </header>

        <!-- Role selection -->
        <section class="role-section">

            <p class="small-title">
                SELECT YOUR ROLE
            </p>

            <h2>Who are you?</h2>

            <p class="description">
                Choose one option. Your login form will open next.
            </p>

            <div class="role-grid">

                <!-- Student -->
                <button
                    class="role-card student-card"
                    type="button"
                    data-role="student"
                >

                    <span class="role-icon">

                        <svg viewBox="0 0 24 24">
                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M5 21c0-4 3-7 7-7s7 3 7 7"
                            ></path>
                        </svg>

                    </span>

                    <span class="role-label">
                        STUDENT ACCESS
                    </span>

                    <h3>I am a Student</h3>

                    <p>
                        View, create and manage your college notes.
                    </p>

                    <span class="arrow">→</span>

                </button>

                <div class="or-divider">
                    <span>OR</span>
                </div>

                <!-- Admin -->
                <button
                    class="role-card admin-card"
                    type="button"
                    data-role="admin"
                >

                    <span class="role-icon">

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 3l8 6v6l-8 6-8-6V9z"
                            ></path>

                            <path d="M9 12h6"></path>
                            <path d="M12 9v6"></path>
                        </svg>

                    </span>

                    <span class="role-label">
                        ADMIN ACCESS
                    </span>

                    <h3>I am an Admin</h3>

                    <p>
                        Review, approve and manage uploaded notes.
                    </p>

                    <span class="arrow">→</span>

                </button>

            </div>

        </section>

        <footer>
            ◆ &nbsp; ORGANIZE. CREATE. INSPIRE. &nbsp; ◆
        </footer>

    </main>

    <script src="role.js"></script>

</body>
</html>
