<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NoteCraft - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">

        <!-- Glowing Stars -->
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
        <span class="star s8"></span>
        <span class="star s9"></span>
        <span class="star s10"></span>
        <span class="star s11"></span>
        <span class="star s12"></span>
        <span class="star s13"></span>
        <span class="star s14"></span>
        <span class="star s15"></span>

        <!-- Network Lines -->
        <div class="network-line l1"></div>
        <div class="network-line l2"></div>
        <div class="network-line l3"></div>
        <div class="network-line l4"></div>
        <div class="network-line l5"></div>
        <div class="network-line l6"></div>
        <div class="network-line l7"></div>

    </div>


    <!-- ================= SPLASH SCREEN ================= -->

    <section class="splash-screen" id="splashScreen">

        <div class="splash-logo">

    <svg
        class="notecraft-code-logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="NoteCraft NC logo"
    >

        <defs>
            <linearGradient
                id="splashLogoGradient"
                x1="10%"
                y1="10%"
                x2="90%"
                y2="90%"
            >
                <stop offset="0%" stop-color="#4338ca"/>
                <stop offset="55%" stop-color="#22d3ee"/>
                <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
        </defs>

        <!-- Letter C -->
        <path
            d="
                M80 23
                C72 15 62 11 50 11
                C28 11 12 28 12 50
                C12 72 28 89 50 89
                C63 89 73 84 80 77
            "
            fill="none"
            stroke="url(#splashLogoGradient)"
            stroke-width="12"
            stroke-linecap="round"
        />

        <!-- Letter N -->
        <path
            d="
                M32 72
                V28
                L68 72
                V28
            "
            fill="none"
            stroke="url(#splashLogoGradient)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- Folded-page detail -->
        <path
            d="M61 65 L68 72 L68 60 Z"
            fill="#c4b5fd"
        />

    </svg>

</div>

        <h1>
            Note<span>Craft</span>
        </h1>

        <p>SMART DIGITAL NOTES MAKER</p>

        <div class="loading-line">
            <div></div>
        </div>

    </section>


    <!-- ================= LOGIN PAGE ================= -->

    <main class="login-container" id="loginPage">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo-box">

    <svg
        class="notecraft-code-logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="NoteCraft NC logo"
    >

        <defs>
            <linearGradient
                id="loginLogoGradient"
                x1="10%"
                y1="10%"
                x2="90%"
                y2="90%"
            >
                <stop offset="0%" stop-color="#4338ca"/>
                <stop offset="55%" stop-color="#22d3ee"/>
                <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
        </defs>

        <!-- Letter C -->
        <path
            d="
                M80 23
                C72 15 62 11 50 11
                C28 11 12 28 12 50
                C12 72 28 89 50 89
                C63 89 73 84 80 77
            "
            fill="none"
            stroke="url(#loginLogoGradient)"
            stroke-width="12"
            stroke-linecap="round"
        />

        <!-- Letter N -->
        <path
            d="
                M32 72
                V28
                L68 72
                V28
            "
            fill="none"
            stroke="url(#loginLogoGradient)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <!-- Folded-page detail -->
        <path
            d="M61 65 L68 72 L68 60 Z"
            fill="#c4b5fd"
        />

    </svg>

</div>

            <h1 class="brand">
                Note<span>Craft</span>
            </h1>

            <p class="tagline">
                SMART DIGITAL NOTES MAKER
            </p>


            <!-- Divider -->
            <div class="divider">
                <span></span>
                <i></i>
                <span></span>
            </div>


            <!-- Welcome -->
            <h2>Welcome Back!</h2>

            <p class="welcome-text">
                Login to continue your notes journey
            </p>


            <!-- Email -->
            <div class="input-box">

                <span class="input-icon">♙</span>

                <input
                    type="email"
                    id="email"
                    placeholder="Email or Username"
                    autocomplete="off"
                >

            </div>


            <!-- Password -->
            <div class="input-box">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="eye-button"
                    id="eyeButton"
                >
                    👁
                </button>

            </div>


            <!-- Remember + Forgot -->
            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>Remember Me</span>

                </label>

                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->
            <button
                class="login-button"
                id="loginButton"
            >

                <span>Login</span>

                <strong>→</strong>

            </button>


            <!-- OR -->
            <div class="or-divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- Register -->
            <button
                class="register-button"
                id="registerButton"
            >

                <span class="register-icon">
                    ♙+
                </span>

                Create New Account

            </button>


            <!-- Bottom Text -->
            <p class="bottom-text">
                ✨ &nbsp; Organize. Create. Inspire.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
